shell "/run/current-system/sw/bin/nu"
include ./themes/tokyo-night-day.conf

hide_window_decorations titlebar-only
modify_font strikethrough_thickness 1px
modify_font strikethrough_position 22px
macos_traditional_fullscreen yes
confirm_os_window_close 0
macos_option_as_alt yes
window_margin_width 0 2
dim_opacity 1.0

map shift+enter send_text all \x1b[13;2u
map opt+ctrl+f  send_text all \x1bf
map opt+ctrl+b  send_text all \x1bb
map ctrl+cmd+d  send_key ctrl+alt+d
map ctrl+cmd+u  send_key ctrl+alt+u

font_size 16
modify_font baseline 0
modify_font cell_height +8
modify_font underline_position 2

font_family MD IO Trial

map f5 load_config_file
