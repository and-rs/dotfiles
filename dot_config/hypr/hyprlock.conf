$font = SF Pro
$font_mono = Input

general {
    hide_cursor = true
}

# Keep authentication feedback immediate and unambiguous.
animations {
    enabled = false
}

# Render a neutral lock surface on every connected display.
background {
    monitor =
    color = rgba(000000ff)
}

# The interactive surface lives only on the built-in display.
input-field {
    monitor = $main_monitor
    size = 280, 52
    outline_thickness = 2
    inner_color = rgba(1c1c1eff)
    outer_color = rgba(8e8e93ff)
    check_color = rgba(0a84ffff)
    fail_color = rgba(ff453aff)
    font_color = rgba(f5f5f7ff)
    font_family = $font
    font_size = 20
    rounding = -1
    fade_on_empty = false
    placeholder_text = Enter Password
    check_text = Authenticating...
    fail_text = Incorrect password
    dots_size = 0.28
    dots_spacing = 0.25
    position = 0, -380
    halign = center
    valign = center
}

# big clock
label {
    monitor = $main_monitor
    text = $TIME
    color = rgba(f5f5f7ff)
    font_size = 104
    font_family = $font_mono
    position = 0, 280
    halign = center
    valign = center
}

# current date
label {
    monitor = $main_monitor
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(ebebf0ff)
    font_size = 26
    font_family = $font
    position = 0, 375
    halign = center
    valign = center
}
